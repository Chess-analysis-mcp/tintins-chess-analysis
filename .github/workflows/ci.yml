name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The app ships to all three (Linux/macOS via the .command launcher, Windows via the .bat, macOS
    # via the .app), and several code paths are platform-sensitive: settings.json permissions, the
    # git/zip self-updater's subprocess calls, and DATA_DIR resolution. Run the suite everywhere so
    # a Windows- or Linux-only regression fails here rather than on a user's machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # uv builds the env from pyproject/uv.lock and fetches a compatible Python — no Stockfish or
      # `claude` CLI needed: the suite is all fast unit/mock tests (network and engine are mocked).
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Run the test suite
        run: uv run --extra dev pytest
